name: Publish preview
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download the latest preview-site artifact from the website repo
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # Take the latest preview run on redesign regardless of status: the
          # conclusion of a just-finished run may not have propagated to
          # `--status success` queries yet (we hit this race in practice).
          RUN_ID=$(gh run list -R IGE-OPERA/ige-opera.github.io --workflow preview.yml --branch redesign --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No preview run found yet."
            exit 1
          fi
          echo "Waiting for website-repo run $RUN_ID"
          gh run watch "$RUN_ID" -R IGE-OPERA/ige-opera.github.io --exit-status --interval 10 || {
            echo "Run $RUN_ID did not succeed; keeping the previous preview."
            exit 1
          }
          rm -rf dist && mkdir dist
          gh run download "$RUN_ID" -R IGE-OPERA/ige-opera.github.io -n preview-site -D dist
          test -f dist/index.html
      - name: Publish to gh-pages (this repo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -b gh-pages
          git add -A
          git commit -qm "Preview update (from IGE-OPERA/ige-opera.github.io redesign)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/IGE-OPERA/preview.git" gh-pages
